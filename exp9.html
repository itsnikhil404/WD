<!DOCTYPE html>
<html>
<head>
  <title>CSS Link Styles</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    a:link { color: blue; text-decoration: none; }
    a:visited { color: purple; }
    a:hover { color: white; background-color: green; text-decoration: underline; }
    a:active { color: red; }
  </style>
</head>
<body>
  <h1>CSS Link Styles</h1>
  <p>Move the mouse over a link or click it to see the styles.</p>
  <a href="https://www.wikipedia.org/">Wikipedia</a><br><br>
  <a href="https://www.w3schools.com/">W3Schools</a><br><br>
  <a href="https://developer.mozilla.org/">MDN Web Docs</a>
</body>
</html>
