<html>
<head>
    <title>Document</title>
</head>
<body >
 <br>
    <form action="register.jsp" name="StudentRegistration" method="post">
        <table cellpadding="2" width="50%"border="10" align="center" cellspacing="2" bgima>
            <tr>
                <td colspan="2">
                    <center><font size="4"><b>Student Registration Form</b></font> </center>
                </td>
            </tr>
            <tr>
                    <td>Name</td>
                    <td> <input type="text" name="textnames" id="textname" size="30"></td>
            </tr>
        <tr>
                    <td>Father Name</td>
                    <td> <input type="text" name="fathername" id="fatherame" size="30"></td>
            </tr>
        <tr>
                    <td> Mother Name</td>
                    <td> <input type="text" name="moyhername" id="mothertname" size="30"></td>
            </tr>
            <tr>
                    <td>Postal Address</td>
                    <td> <input type="text" name="paddress" id="paddress" size="30"></td>
            </tr>
            <tr>
                    <td>Personal Address </td>
                    <td> <input type="text" name="personaladdress" id="personaladdress" size="30"> </td>
            </tr>
            <tr>
                    <td>Sex</td>
                    <td> <input type="radio" name="sex" id="sex" value="male" size="10">Male
                     <input type="radio" name="sex" id="sex" value="female" size="10">Female </td>
            </tr>
            <tr>
                <td>City</td>
                <td><select name ="City">
                  <option value="-1" selected>select..</option>
                  <option value="New Delhi">NEW DELHI</option>
                  <option value="Goa">GOA</option>
                  <option value="Mumbai">MUMBAI</option>
                  <option value="Patna">PATNA</option>
                </select>
                </td>
            </tr>
            <tr>
                <td>Course</td>
                <td><select name ="Course">
                  <option value="-1" selected>select..</option>
                  <option value="B.Tech">B.TECH</option>
                  <option value="MCA">MCA</option>
                  <option value="BCA">BCA</option>
                  <option value="BBA">BBA</option>
                </select>
                </td>
            </tr>
            <tr>
                    <td>PIN Code</td>
                    <td> <input type="text" name="pincode" id="pincode" size="30"> </td>
            </tr>
            <tr>
                    <td>Email ID </td>
                    <td> <input type="email" name="emailid" id="emailid" size="30"> </td>
            </tr>
            <tr>
                    <td>MOBILE NO</td>
                    <td> <input type="number" name="mobile" id="mobile" size="30"> </td>
            </tr>
            <tr>
                    <td>DOB</td>
                    <td> <input type="date" name="dob" id="dob" size="30"> </td>
            </tr>
            
            <tr>
                <td>
                    <input type="reset">
                    <td colspan="2"><input type="submit" value="submit form"></td>
                </td>
            </tr>
            
        </table>
    </form>
</body>
</html>
